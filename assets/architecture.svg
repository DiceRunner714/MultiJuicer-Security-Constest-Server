<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <linearGradient id="hostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="k3sGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="juiceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">MultiJuicer CTF Server — Architecture</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Automated OWASP MultiJuicer deployment on a local K3s cluster</text>

  <!-- Players -->
  <g>
    <rect x="30" y="250" width="150" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="105" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Players</text>
    <text x="105" y="305" text-anchor="middle" font-size="11" fill="#374151">Team A · Team B</text>
    <text x="105" y="320" text-anchor="middle" font-size="11" fill="#374151">Team C · Team N</text>
    <text x="105" y="342" text-anchor="middle" font-size="10" fill="#6b7280">(same LAN)</text>
  </g>

  <!-- Ethernet arrow into host -->
  <line x1="180" y1="305" x2="255" y2="305" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217" y="292" text-anchor="middle" font-size="10.5" fill="#374151">Wired Ethernet</text>
  <text x="217" y="325" text-anchor="middle" font-size="10.5" fill="#374151">HTTP via Ingress</text>

  <!-- Host machine outer box -->
  <rect x="260" y="90" width="690" height="490" rx="14" fill="url(#hostGrad)" stroke="#6366f1" stroke-width="2"/>
  <text x="285" y="118" font-size="14" font-weight="700" fill="#3730a3">Host Machine (Ubuntu 20.04 / 22.04 / 24.04)</text>
  <text x="285" y="136" font-size="10.5" fill="#4338ca">setup-ctf-up.sh — installs Helm, deploys K3s, deploys MultiJuicer</text>

  <!-- K3s box -->
  <rect x="285" y="155" width="640" height="395" rx="12" fill="url(#k3sGrad)" stroke="#059669" stroke-width="2"/>
  <text x="305" y="180" font-size="13" font-weight="700" fill="#065f46">K3s Cluster (lightweight Kubernetes)</text>

  <!-- Ingress -->
  <rect x="310" y="200" width="220" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="420" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Ingress Controller</text>
  <text x="420" y="242" text-anchor="middle" font-size="10" fill="#374151">routes each team to its pod</text>

  <!-- MultiJuicer controller -->
  <rect x="560" y="200" width="330" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="725" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">MultiJuicer Controller (Helm chart)</text>
  <text x="725" y="242" text-anchor="middle" font-size="10" fill="#374151">provisions &amp; isolates instances, admin panel + credentials</text>

  <!-- arrow ingress -> controller -->
  <line x1="530" y1="230" x2="555" y2="230" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- arrow controller down to pods -->
  <line x1="725" y1="260" x2="725" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="285" font-size="10" fill="#374151">creates on demand</text>

  <!-- Ingress down to pods -->
  <line x1="420" y1="260" x2="420" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Juice Shop pods row -->
  <rect x="305" y="300" width="600" height="220" rx="10" fill="url(#juiceGrad)" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="325" y="322" font-size="12" font-weight="700" fill="#9a3412">Isolated OWASP Juice Shop Pods (one per team)</text>

  <g>
    <rect x="330" y="340" width="160" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="410" y="365" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">Team A</text>
    <text x="410" y="385" text-anchor="middle" font-size="10" fill="#374151">Juice Shop</text>
    <text x="410" y="400" text-anchor="middle" font-size="10" fill="#374151">pod + volume</text>
    <text x="410" y="425" text-anchor="middle" font-size="9.5" fill="#9ca3af">sandboxed</text>
  </g>
  <g>
    <rect x="510" y="340" width="160" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="590" y="365" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">Team B</text>
    <text x="590" y="385" text-anchor="middle" font-size="10" fill="#374151">Juice Shop</text>
    <text x="590" y="400" text-anchor="middle" font-size="10" fill="#374151">pod + volume</text>
    <text x="590" y="425" text-anchor="middle" font-size="9.5" fill="#9ca3af">sandboxed</text>
  </g>
  <g>
    <rect x="690" y="340" width="160" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="770" y="365" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">Team N…</text>
    <text x="770" y="385" text-anchor="middle" font-size="10" fill="#374151">Juice Shop</text>
    <text x="770" y="400" text-anchor="middle" font-size="10" fill="#374151">pod + volume</text>
    <text x="770" y="425" text-anchor="middle" font-size="9.5" fill="#9ca3af">created on join</text>
  </g>

  <!-- ingress fan-out lines to pods -->
  <line x1="420" y1="300" x2="410" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="420" y1="300" x2="590" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="420" y1="300" x2="770" y2="340" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="285" y="560" width="14" height="14" fill="url(#k3sGrad)" stroke="#059669"/>
  <text x="305" y="571" font-size="10" fill="#374151">K3s-managed component</text>
  <rect x="470" y="560" width="14" height="14" fill="url(#juiceGrad)" stroke="#ea580c"/>
  <text x="490" y="571" font-size="10" fill="#374151">Per-team isolated instance</text>
</svg>
